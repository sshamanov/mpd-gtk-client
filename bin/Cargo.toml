[package]
name = "mpd-client"
version = "0.1.0"
edition = "2021"
authors = ["schaman"]
license = "MIT"

[[bin]]
name = "mpd-client"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
anyhow = { workspace = true }
log = { workspace = true }
env_logger = "0.11"

# Internal workspace crates
state = { path = "../state", version = "0.1.0" }
ui = { path = "../ui", version = "0.1.0" }
mpd-adapter = { path = "../mpd-adapter", version = "0.1.0" }
cover-fetcher = { path = "../cover-fetcher", version = "0.1.0" }