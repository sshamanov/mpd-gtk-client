[package]
name = "mpd-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["schaman"]
license = "MIT"

[dependencies]
gtk4 = { version = "0.11", features = ["v4_14"] }
glib = "0.22"
gdk4 = "0.11"

ureq = { version = "3", optional = true, default-features = false, features = ["rustls", "gzip"] }
rustls = { version = "0.23", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
dirs = "6"
log = "0.4"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
unicode-normalization = "0.1"
thiserror = "2"
md-5 = "0.10"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"], optional = true }
adw = { package = "libadwaita", version = "0.9", default-features = false, features = ["v1_7"] }

[features]
online-cover-art = ["ureq", "rustls"]
mpris = ["zbus"]

[dev-dependencies]
tempfile = "3"
